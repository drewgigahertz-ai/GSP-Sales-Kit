<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing Matrix</title>
  <!--
    PRICING MATRIX tab: every product's selling prices from GHZ PRICING MATRIX, for every branch (no branch filter).
    Laptops, desktops, accessories and mobiles; each promo's prices for all payment terms side by side (no bundle /
    with bundle, or regular / with a laptop), its freebies and worth, its dates, the vendor freebies' claiming, and
    the salesman incentives (staff only: never copied). Fed by pricing-matrix-bridge.js through window messages.
  -->
  <link href="./node_modules/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="./node_modules/@fontsource/plus-jakarta-sans/400.css" rel="stylesheet">
  <link href="./node_modules/@fontsource/plus-jakarta-sans/500.css" rel="stylesheet">
  <link href="./node_modules/@fontsource/plus-jakarta-sans/600.css" rel="stylesheet">
  <link href="./node_modules/@fontsource/plus-jakarta-sans/700.css" rel="stylesheet">
  <link href="./node_modules/@fontsource/plus-jakarta-sans/800.css" rel="stylesheet">
  <script src="./quotation-terms.js"></script>
  <style>
    :root {
      --ink: #0f172a; --muted: #64748b; --soft: #94a3b8; --line: #e2e8f0; --bg: #eef2f8; --card: #ffffff;
      --blue: #0026e6; --navy: #0012b3; --blue-soft: #eef2ff; --green: #047857; --green-soft: #ecfdf5;
      --amber: #b45309; --amber-soft: #fef3c7; --red: #b91c1c; --red-soft: #fee2e2; --violet: #6d28d9; --violet-soft: #f3e8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Plus Jakarta Sans", Arial, sans-serif; font-size: 13px; }
    button, input, select { font-family: inherit; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

    /* ---------- top bar ---------- */
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px 12px; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(15, 23, 42, .05); }
    .title { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
    .title .mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--navy), #2b5cf2); color: #fff; font-size: 18px; }
    .title h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .4px; color: var(--navy); }
    .title small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; }
    /* Under development: the tab is out for testing and feedback (as on the Quotation tab). */
    .dev-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #f59e0b; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .6px; vertical-align: 2px; }
    .dev-note { flex-basis: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; font-size: 12px; }
    .dev-note i { font-size: 15px; }
    .search { position: relative; flex: 1 1 340px; max-width: 560px; }
    .search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--soft); }
    .search input { width: 100%; padding: 10px 34px 10px 36px; border: 1.5px solid #cbd5e1; border-radius: 11px; font-size: 13.5px; font-weight: 500; outline: none; background: #f8fafc; transition: border-color .15s, background .15s; }
    .search input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(0, 38, 230, .08); }
    .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--soft); cursor: pointer; font-size: 14px; display: none; }
    .search.has-text .clear { display: block; }
    .kinds { display: flex; gap: 6px; flex-wrap: wrap; }
    .kinds button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #1e293b; font-weight: 700; font-size: 12.5px; cursor: pointer; }
    .kinds button .n { padding: 0 7px; border-radius: 999px; background: #f1f5f9; color: var(--muted); font-size: 10.5px; }
    .kinds button:hover { border-color: var(--blue); }
    .kinds button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .kinds button.on .n { background: rgba(255, 255, 255, .2); color: #fff; }
    .filters { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .filters select { padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: 12px; font-weight: 600; color: var(--ink); }
    .switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    .switch input { display: none; }
    .switch .track { width: 30px; height: 17px; border-radius: 999px; background: #cbd5e1; position: relative; transition: background .15s; }
    .switch .track:after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch input:checked + .track { background: var(--blue); }
    .switch input:checked + .track:after { left: 15px; }
    .filters .spacer { flex: 1; }
    #count { color: var(--soft); }

    /* ---------- the search's dropdown: the current group's products (typing narrows it) ---------- */
    .results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: min(460px, 70vh); overflow: auto; padding: 6px; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 18px 40px rgba(15, 23, 42, .18); display: none; }
    .results.open { display: block; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; padding: 9px 12px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; color: inherit; }
    .row:hover, .row.active { background: var(--blue-soft); }
    .row.on .name:after { content: " ✓"; color: var(--blue); }
    .body { overflow: auto; min-height: 0; }
    .row .name { font-weight: 700; font-size: 12.8px; line-height: 1.3; }
    .row .price { font-weight: 800; color: var(--navy); white-space: nowrap; }
    .row .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; color: var(--muted); font-size: 11px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .2px; background: #f1f5f9; color: #334155; }
    .tag.promo { background: var(--blue-soft); color: #3730a3; }
    .tag.soon { background: var(--amber-soft); color: var(--amber); }
    .tag.ended { background: var(--red-soft); color: var(--red); }
    .tag.kind { background: #e0f2fe; color: #075985; text-transform: uppercase; }
    .more, .empty { padding: 14px; color: var(--muted); font-size: 12px; text-align: center; }

    .detail { max-width: 1400px; margin: 0 auto; padding: 18px 22px 30px; }
    /* Previous / next product in the current results. */
    .stepper { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 700; }
    .stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: #1e293b; }
    .stepper button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
    .stepper button:disabled { opacity: .35; cursor: default; }
    .placeholder { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .placeholder i { font-size: 40px; color: #c7d2fe; display: block; margin-bottom: 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 20px rgba(15, 23, 42, .05); }
    .head { padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: start; }
    .head h2 { margin: 4px 0 2px; font-size: 20px; font-weight: 800; line-height: 1.2; }
    .head .code { color: var(--muted); font-size: 11.5px; font-weight: 600; word-break: break-word; }
    .head .big { text-align: right; }
    .head .big .lbl { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .head .big .amt { font-size: 26px; font-weight: 800; color: var(--navy); white-space: nowrap; }
    .head .big .alt { color: var(--muted); font-size: 11.5px; font-weight: 600; }
    .specs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
    .specs span { padding: 4px 9px; border-radius: 8px; background: #f8fafc; border: 1px solid var(--line); font-size: 11.5px; }
    .specs b { color: var(--muted); font-weight: 700; margin-right: 4px; }
    .head .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; cursor: pointer; background: var(--navy); color: #fff; }
    .btn.light { background: #eef2f7; color: #1e293b; }

    .promos { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
    .promos button { display: grid; gap: 1px; text-align: left; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: #fff; cursor: pointer; max-width: 320px; }
    .promos button b { font-size: 12.5px; }
    .promos button small { color: var(--muted); font-size: 10.5px; font-weight: 600; }
    .promos button.on { border-color: var(--blue); background: var(--blue-soft); }
    .section-label { margin: 16px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }

    .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
    table.terms { width: 100%; border-collapse: separate; border-spacing: 0; }
    table.terms th { position: sticky; top: 0; background: #f8fafc; padding: 10px 14px; text-align: right; font-size: 11px; font-weight: 800; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--line); }
    table.terms th:first-child { text-align: left; border-top-left-radius: 14px; }
    table.terms th:last-child { border-top-right-radius: 14px; }
    table.terms td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; text-align: right; vertical-align: top; }
    table.terms tr:last-child td { border-bottom: 0; }
    table.terms td:first-child { text-align: left; }
    table.terms .term { font-weight: 700; }
    table.terms .banks { color: var(--muted); font-size: 10.5px; font-weight: 500; margin-top: 2px; max-width: 290px; line-height: 1.35; }
    table.terms .amt { font-weight: 800; font-size: 14px; white-space: nowrap; }
    table.terms .mo { color: var(--muted); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    table.terms .none { color: #cbd5e1; }
    table.terms tr.cash td { background: #f8faff; }
    table.terms tr.cash .amt { color: var(--navy); font-size: 15px; }

    .side { display: grid; gap: 12px; }
    .box { padding: 14px 16px; }
    .box h3 { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
    .box h3 i { font-size: 15px; }
    .box ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .box li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.35; }
    .box li i { color: var(--blue); margin-top: 1px; }
    .box .worth { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-weight: 700; }
    .box .worth b { color: var(--green); }
    .box .bundle-name { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-weight: 700; }
    .box .bundle-name b { color: var(--blue); text-align: right; word-break: break-word; }
    .box .muted { color: var(--muted); font-size: 12px; }
    .dates { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; }
    .dates .arrow { color: var(--soft); }
    .valid { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 2px; }
    .box.staff { border-color: #ddd6fe; background: linear-gradient(180deg, #faf5ff, #fff); }
    .box.staff h3 { color: var(--violet); }
    .box.staff .lock { margin-left: auto; padding: 1px 7px; border-radius: 999px; background: var(--violet-soft); color: var(--violet); font-size: 9.5px; letter-spacing: .3px; }
    .box.staff .amount { font-size: 18px; font-weight: 800; color: var(--violet); }
    body.hide-staff .staff { display: none; }

    /* A price in the terms table adds the product to the quotation at that term. */
    table.terms td.pick { cursor: pointer; border-radius: 8px; }
    table.terms td.pick:hover { background: var(--blue-soft); box-shadow: inset 0 0 0 1px #c7d2fe; }
    table.terms td.pick:hover .amt:after { content: " +"; color: var(--blue); }
    .btn.quote { background: var(--green); }
    .btn.on { background: var(--blue-soft); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--blue); }
    .hint { color: var(--soft); font-size: 11px; font-weight: 600; }
    /* Branch stock box */
    .stock-home { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 14px; }
    .stock-home .n { color: var(--green); }
    .stock-home .n.zero { color: var(--red); }
    .stock-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .stock-list span { padding: 2px 8px; border-radius: 999px; background: #f1f5f9; font-size: 11px; font-weight: 700; }
    .stock-list span b { color: var(--green); margin-left: 3px; }
    /* Compare: up to 3 products side by side */
    .tray { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; background: var(--blue-soft); font-size: 12px; font-weight: 700; color: var(--navy); }
    .tray[hidden] { display: none; }
    .tray .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #fff; border: 1px solid #c7d2fe; color: var(--ink); font-weight: 600; max-width: 280px; }
    .tray .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tray .chip button { border: 0; background: #eef2f7; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; color: var(--muted); font-size: 11px; }
    .tray .btn { padding: 5px 11px; font-size: 12px; }
    .tray .spacer { flex: 1; }
    .compare { overflow-x: auto; }
    table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 640px; }
    table.cmp th, table.cmp td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; text-align: left; font-size: 12.5px; }
    table.cmp th.lbl, table.cmp td.lbl { width: 170px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; background: #f8fafc; }
    table.cmp thead th { position: sticky; top: 0; background: #fff; z-index: 1; border-bottom: 2px solid var(--line); }
    table.cmp thead th h3 { margin: 4px 0 2px; font-size: 14px; font-weight: 800; line-height: 1.25; }
    table.cmp thead th .code { color: var(--muted); font-size: 11px; font-weight: 600; }
    table.cmp thead .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    table.cmp thead .acts .btn { padding: 4px 9px; font-size: 11.5px; }
    table.cmp .amt { font-weight: 800; white-space: nowrap; }
    table.cmp .mo { color: var(--muted); font-size: 10.5px; font-weight: 600; }
    table.cmp .win { color: var(--green); }
    table.cmp .win:after { content: " ★"; font-size: 10px; }
    table.cmp tr.sec td { background: #f8fafc; color: var(--navy); font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
    table.cmp select { max-width: 100%; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 11.5px; font-weight: 600; }

    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; padding: 9px 16px; border-radius: 10px; background: #0f172a; color: #fff; font-weight: 700; font-size: 12.5px; transition: all .2s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">
      <div class="mark"><i class="bi bi-tags-fill"></i></div>
      <div><h1>PRICING MATRIX<span class="dev-badge">UNDER DEVELOPMENT</span></h1><small>Prices, promos, bundles &amp; incentives · all branches</small></div>
    </div>
    <div class="search" id="searchBox">
      <i class="bi bi-search"></i>
      <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search or pick a product: model, part number, SKU or promo (Ctrl+Shift+L)" aria-label="Search products" role="combobox" aria-expanded="false" aria-controls="results">
      <button class="clear" id="clearSearch" type="button" aria-label="Clear the search"><i class="bi bi-x-circle-fill"></i></button>
      <div class="results" id="results" role="listbox" aria-label="Products"></div>
    </div>
    <div class="kinds" id="kinds" role="group" aria-label="Product group"></div>
    <div class="filters">
      <label>Category <select id="category"><option value="">All</option></select></label>
      <label>Sort <select id="sort">
        <option value="name">Name A–Z</option>
        <option value="low">Cash price: low to high</option>
        <option value="high">Cash price: high to low</option>
        <option value="ending">Promo ending soonest</option>
      </select></label>
      <label class="switch"><input type="checkbox" id="promoOnly"><span class="track"></span> With a promo only</label>
      <label class="switch" title="Vendor promos are for staff only: they are never copied"><input type="checkbox" id="showStaff" checked><span class="track"></span> <i class="bi bi-lock-fill"></i> Vendor promo</label>
      <span class="spacer"></span>
      <span id="count"></span>
    </div>
    <div class="tray" id="tray" hidden></div>
    <div class="dev-note"><i class="bi bi-cone-striped" aria-hidden="true"></i><span><b>Under development:</b> this tab is still being tested. Check the prices against the price matrix before quoting them to a customer, and send your feedback to Process Improvement.</span></div>
  </div>
  <div class="body">
    <div class="detail" id="detail"><div class="placeholder"><div><i class="bi bi-hourglass-split"></i>Loading the price matrix…</div></div></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var peso = function (n) { return n == null ? "" : "₱" + money(n); };
  function toParent(message) { if (window.parent && window.parent !== window) window.parent.postMessage(message, "*"); }

  var KINDS = [["laptop", "Laptop", "bi-laptop"], ["desktop", "Desktop", "bi-pc-display"], ["attachment", "Accessories", "bi-mouse2"], ["mobile", "Mobile", "bi-phone"]];
  // Months for the monthly figure ("₱4,166.58/mo"): quotation-terms.js.
  var MONTHS = (window.QuotationTerms && window.QuotationTerms.months) || {};
  var TERMS = (window.QuotationTerms && window.QuotationTerms.list) || [];
  // Price sets shown side by side: laptops no bundle / with bundle; accessories regular / with a laptop.
  function setsFor(product, promo) {
    var names = product.kind === "attachment" ? { noBundle: "Regular", withBundle: "With a laptop" } : { noBundle: "No bundle", withBundle: "With bundle" };
    var t = promo.terms || {};
    var sets = ["noBundle", "withBundle"].filter(function (s) { return t[s] && Object.keys(t[s]).length; });
    if (sets.length === 1 && product.kind !== "laptop" && product.kind !== "attachment") names[sets[0]] = "Price";
    return sets.map(function (s) { return { key: s, label: names[s], prices: t[s] }; });
  }
  function cashOf(product, promo) {
    var t = (promo || product.promos[0]).terms || {};
    return (t.withBundle && t.withBundle.cash) || (t.noBundle && t.noBundle.cash) || null;
  }

  // Promo dates: "Ends in 3 days" (amber, within 7 days), "Ended" (red), "Starts Jun 1".
  var today = new Date(); today.setHours(0, 0, 0, 0);
  function day(iso) { var m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function dayLabel(iso) { var d = day(iso); return d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : ""; }
  function dateState(promo) {
    var start = day(promo.start), end = day(promo.end);
    if (end && end < today) return { cls: "ended", text: "Ended " + dayLabel(promo.end) };
    if (start && start > today) return { cls: "", text: "Starts " + dayLabel(promo.start) };
    if (end) {
      var left = Math.round((end - today) / 864e5);
      if (left <= 7) return { cls: "soon", text: left === 0 ? "Ends today" : "Ends in " + left + " day" + (left === 1 ? "" : "s") };
    }
    return null;
  }
  var hasPromo = function (promo) { return promo.title && !/^no promo$/i.test(promo.title); };

  // ---------- state ----------
  var products = [];
  // hasStock / stockAsOf / homeBranch: branch stock from the server (pricing-matrix-bridge.js).
  var meta = { hasStock: false, stockAsOf: "", homeBranch: "" };
  // view: one product ("detail") or the products picked to compare side by side ("compare", up to COMPARE_MAX).
  var COMPARE_MAX = 3;
  var state = { kind: "laptop", category: "", sort: "name", promoOnly: false, query: "", selected: "", promo: 0, view: "detail", compare: [], comparePromo: {} };
  // The product last opened in each group (kept on this laptop), so coming back shows it again.
  var lastPicked = {};
  try {
    var saved = JSON.parse(localStorage.getItem("saleskit.pricing.view") || "{}");
    lastPicked = saved.picked || {};
    Object.assign(state, { kind: saved.kind || state.kind, sort: saved.sort || state.sort, promoOnly: Boolean(saved.promoOnly), compare: Array.isArray(saved.compare) ? saved.compare.slice(0, COMPARE_MAX) : [] });
  } catch (e) { /* defaults */ }
  try { el("showStaff").checked = localStorage.getItem("saleskit.pricing.staff") !== "0"; } catch (e) { /* shown */ }
  function remember() { try { localStorage.setItem("saleskit.pricing.view", JSON.stringify({ kind: state.kind, sort: state.sort, promoOnly: state.promoOnly, picked: lastPicked, compare: state.compare })); } catch (e) { /* not kept */ } }

  // ---------- Add to Quotation ----------
  // The price set a product is quoted with first: with bundle (accessories: with a laptop) when it has one.
  function defaultSet(sets) { return (sets.filter(function (s) { return s.key === "withBundle"; })[0] || sets[0] || { key: "withBundle" }).key; }
  // Sent to the Quotation tab (quotation-bridge.js addToQuotation): the item code, promo title, bundle and term.
  function quote(p, promo, setKey, term) {
    toParent({ channel: "saleskit-pricing-quote", request: { code: p.code, promo: promo && hasPromo(promo) ? promo.title : "", bundle: setKey === "noBundle" ? "no" : "with", term: term || "cash" } });
  }

  // ---------- branch stock ----------
  function units(p, branch) { return (p.stock && Number(p.stock[branch])) || 0; }
  function totalUnits(p) { return Object.keys(p.stock || {}).reduce(function (s, b) { return s + units(p, b); }, 0); }
  function stockBox(p) {
    if (!meta.hasStock || p.kind !== "laptop") return "";
    var home = meta.homeBranch && ["HO", "ALL", "ALL BRANCHES"].indexOf(meta.homeBranch) === -1 ? meta.homeBranch : "";
    var others = Object.keys(p.stock || {}).filter(function (b) { return b !== home && units(p, b) > 0; }).sort(function (a, b) { return units(p, b) - units(p, a) || a.localeCompare(b); });
    var asOf = day(meta.stockAsOf);
    return '<div class="card box"><h3><i class="bi bi-box-seam" style="color:var(--blue)"></i> Branch stock' + (asOf ? '<span class="hint" style="margin-left:auto;text-transform:none;letter-spacing:0">as of ' + esc(dayLabel(meta.stockAsOf)) + "</span>" : "") + "</h3>"
      + (home ? '<div class="stock-home"><span>' + esc(home) + '</span><span class="n' + (units(p, home) ? "" : " zero") + '">' + (units(p, home) || "No") + " unit" + (units(p, home) === 1 ? "" : "s") + "</span></div>" : "")
      + (others.length ? '<div class="stock-list">' + others.map(function (b) { return "<span>" + esc(b) + "<b>" + units(p, b) + "</b></span>"; }).join("") + "</div>"
        : '<div class="muted" style="margin-top:' + (home ? "8px" : "0") + '">' + (home ? "None at other branches." : "No stock at any branch.") + "</div>")
      + "</div>";
  }
  function applyStaff() { document.body.classList.toggle("hide-staff", !el("showStaff").checked); }
  applyStaff();

  // ---------- filtering ----------
  function inKind() { return products.filter(function (p) { return p.kind === state.kind; }); }
  function visible() {
    var words = state.query.toLowerCase().split(/\s+/).filter(Boolean);
    var list = inKind().filter(function (p) {
      if (state.category && p.category !== state.category) return false;
      if (state.promoOnly && !p.promos.some(hasPromo)) return false;
      if (!words.length) return true;
      var hay = (p.code + " " + p.model + " " + p.partNumber + " " + p.category + " " + p.promos.map(function (x) { return x.title; }).join(" ")).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
    var endOf = function (p) { var ends = p.promos.map(function (x) { return day(x.end); }).filter(function (d) { return d && d >= today; }); return ends.length ? Math.min.apply(null, ends) : Infinity; };
    if (state.sort === "low" || state.sort === "high") {
      var dir = state.sort === "low" ? 1 : -1;
      // Products without a cash price go last either way.
      list.sort(function (a, b) {
        var x = cashOf(a), y = cashOf(b);
        if (x == null || y == null) return (x == null) - (y == null);
        return (x - y) * dir;
      });
    } else if (state.sort === "ending") {
      list.sort(function (a, b) { return endOf(a) - endOf(b); });
    }
    return list;
  }

  function renderKinds() {
    var counts = {};
    products.forEach(function (p) { counts[p.kind] = (counts[p.kind] || 0) + 1; });
    if (!counts[state.kind]) state.kind = (KINDS.filter(function (k) { return counts[k[0]]; })[0] || KINDS[0])[0];
    el("kinds").innerHTML = KINDS.filter(function (k) { return counts[k[0]]; }).map(function (k) {
      return '<button type="button" data-kind="' + k[0] + '"' + (k[0] === state.kind ? ' class="on"' : "") + '><i class="bi ' + k[2] + '"></i>' + k[1] + ' <span class="n">' + counts[k[0]].toLocaleString() + "</span></button>";
    }).join("");
    var cats = Array.from(new Set(inKind().map(function (p) { return p.category; }).filter(Boolean))).sort();
    if (cats.indexOf(state.category) === -1) state.category = "";
    el("category").innerHTML = '<option value="">All</option>' + cats.map(function (c) { return "<option" + (c === state.category ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
    el("category").parentElement.style.display = cats.length ? "" : "none";
    el("sort").value = state.sort;
    el("promoOnly").checked = state.promoOnly;
  }

  // The dropdown under the search: the current group's products with the filters and the search applied.
  var LIMIT = 300;
  var shown = [];      // what the dropdown lists (and previous / next steps through)
  var active = -1;     // the highlighted row while the dropdown is open
  function rowHtml(p, i) {
    var cash = cashOf(p);
    var promoCount = p.promos.filter(hasPromo).length;
    var soon = p.promos.map(dateState).filter(function (s) { return s && s.cls === "soon"; })[0];
    return '<button type="button" class="row' + (p.id === state.selected ? " on" : "") + (i === active ? " active" : "") + '" data-i="' + i + '" role="option" aria-selected="' + (p.id === state.selected) + '">'
      + '<span class="name">' + esc(p.model) + "</span>"
      + '<span class="price">' + (cash ? peso(cash) : "—") + "</span>"
      + '<span class="sub">' + (p.partNumber ? esc(p.partNumber) + " · " : "") + (p.category ? '<span class="tag">' + esc(p.category) + "</span>" : "")
      + (promoCount ? '<span class="tag promo"><i class="bi bi-gift"></i>' + (promoCount > 1 ? promoCount + " promos" : esc(p.promos.filter(hasPromo)[0].title)) + "</span>" : "")
      + (soon ? '<span class="tag soon">' + esc(soon.text) + "</span>" : "") + "</span></button>";
  }
  // Works out the list; keeps the selected product when it is still in it (else the one last opened in this
  // group, else the first).
  function renderList() {
    shown = visible();
    el("count").textContent = shown.length.toLocaleString() + " product" + (shown.length === 1 ? "" : "s");
    if (shown.length && !shown.some(function (p) { return p.id === state.selected; })) {
      var again = shown.filter(function (p) { return p.id === lastPicked[state.kind]; })[0];
      state.selected = (again || shown[0]).id; state.promo = 0;
    }
    if (el("results").classList.contains("open")) fillResults();
    return shown;
  }
  function fillResults() {
    el("results").innerHTML = shown.length
      ? shown.slice(0, LIMIT).map(rowHtml).join("") + (shown.length > LIMIT ? '<div class="more">Showing ' + LIMIT + " of " + shown.length.toLocaleString() + ": type to narrow it down.</div>" : "")
      : '<div class="empty"><i class="bi bi-search"></i><br>Nothing matches. Try another model, part number or category.</div>';
  }
  function openResults() {
    active = Math.max(0, shown.findIndex(function (p) { return p.id === state.selected; }));
    if (state.query) active = 0;
    el("results").classList.add("open");
    el("search").setAttribute("aria-expanded", "true");
    fillResults();
    var row = el("results").querySelector(".row.active");
    if (row) row.scrollIntoView({ block: "nearest" });
  }
  function closeResults() {
    el("results").classList.remove("open");
    el("search").setAttribute("aria-expanded", "false");
    active = -1;
  }
  function pick(i) {
    var p = shown[i];
    if (!p) return;
    state.selected = p.id; state.promo = 0; state.view = "detail";
    lastPicked[state.kind] = p.id; remember();
    closeResults();
    renderDetail();
  }
  function moveActive(by) {
    var rows = el("results").querySelectorAll(".row");
    if (!rows.length) return;
    active = Math.max(0, Math.min(rows.length - 1, active + by));
    Array.prototype.forEach.call(rows, function (r, i) { r.classList.toggle("active", i === active); });
    rows[active].scrollIntoView({ block: "nearest" });
  }
  // Previous / next product in the list (the buttons beside Copy prices, or left / right arrow when not typing).
  function step(by) {
    var i = shown.findIndex(function (p) { return p.id === state.selected; });
    if (i + by < 0 || i + by >= shown.length) return;
    pick(i + by);
  }

  // ---------- the selected product ----------
  function stepper(p) {
    var i = shown.findIndex(function (x) { return x.id === p.id; });
    if (i === -1 || shown.length < 2) return "";
    return '<span class="stepper"><button type="button" id="prev" title="Previous product (left arrow)" aria-label="Previous product"' + (i === 0 ? " disabled" : "") + '><i class="bi bi-chevron-left"></i></button>'
      + (i + 1).toLocaleString() + " of " + shown.length.toLocaleString()
      + '<button type="button" id="next" title="Next product (right arrow)" aria-label="Next product"' + (i === shown.length - 1 ? " disabled" : "") + '><i class="bi bi-chevron-right"></i></button></span>';
  }
  function current() { return products.filter(function (p) { return p.id === state.selected; })[0] || null; }
  function renderDetail() {
    renderTray();
    if (state.view === "compare" && compared().length) { renderCompare(); return; }
    state.view = "detail";
    var p = current();
    if (!p) {
      el("detail").innerHTML = '<div class="placeholder"><div><i class="bi bi-tags"></i>' + (products.length ? (shown.length ? "Pick a product in the search box above." : "Nothing matches the search or filters.") : "No prices yet: sync the server with the price matrix.") + "</div></div>";
      return;
    }
    if (state.promo >= p.promos.length) state.promo = 0;
    var promo = p.promos[state.promo];
    var sets = setsFor(p, promo);
    var cash = cashOf(p, promo);
    var noBundleCash = promo.terms && promo.terms.noBundle && promo.terms.noBundle.cash;
    var h = '<div class="card head"><div><span class="tag kind">' + esc(p.kindLabel) + "</span>" + (p.category ? ' <span class="tag">' + esc(p.category) + "</span>" : "")
      + "<h2>" + esc(p.model) + '</h2><div class="code">' + (p.partNumber ? "<b>" + esc(p.partNumber) + "</b> · " : "") + esc(p.code) + "</div></div>"
      + '<div class="big"><div class="lbl">Cash price' + (sets.length > 1 ? (p.kind === "attachment" ? " · with a laptop" : " · with bundle") : "") + "</div><div class=\"amt\">" + (cash ? peso(cash) : "—") + "</div>"
      + (sets.length > 1 && noBundleCash && noBundleCash !== cash ? '<div class="alt">' + peso(noBundleCash) + (p.kind === "attachment" ? " regular price" : " without the bundle") + "</div>" : "") + "</div>"
      + (p.specs.length ? '<div class="specs">' + p.specs.map(function (s) { return "<span><b>" + esc(s[0]) + "</b>" + esc(s[1]) + "</span>"; }).join("") + "</div>" : "")
      + '<div class="actions"><button type="button" class="btn quote" id="quote" title="Add to the quotation with this promo, ' + (sets.length > 1 ? esc(sets.filter(function (s) { return s.key === defaultSet(sets); })[0].label.toLowerCase()) + ", " : "") + 'cash (Ctrl+Q)"><i class="bi bi-file-earmark-plus"></i> Add to Quotation</button>'
      + '<button type="button" class="btn light" id="copy"><i class="bi bi-clipboard"></i> Copy prices</button>'
      + '<button type="button" class="btn light' + (state.compare.indexOf(p.id) !== -1 ? " on" : "") + '" id="compareToggle" title="Compare up to ' + COMPARE_MAX + ' products side by side"><i class="bi bi-layout-three-columns"></i> ' + (state.compare.indexOf(p.id) !== -1 ? "In compare" : "Compare") + "</button>"
      + '<span class="hint">or click a price below to quote that term</span>' + stepper(p) + "</div></div>";

    if (p.promos.length > 1) {
      h += '<div class="section-label"><i class="bi bi-gift"></i> Promos (' + p.promos.length + ")</div><div class=\"promos\">" + p.promos.map(function (x, i) {
        var s = dateState(x);
        return '<button type="button" data-promo="' + i + '"' + (i === state.promo ? ' class="on"' : "") + "><b>" + esc(x.title) + "</b><small>"
          + esc(x.branches.length ? x.branches.join(", ") : "All branches") + (s ? " · " + esc(s.text) : "") + "</small></button>";
      }).join("") + "</div>";
    } else {
      h += '<div class="section-label"><i class="bi bi-gift"></i> ' + esc(hasPromo(promo) ? promo.title : "No promo") + (promo.branches.length ? " · " + esc(promo.branches.join(", ")) : "") + "</div>";
    }

    // Payment terms: every term with a price in any set, in the price matrix's order.
    var rows = TERMS.filter(function (t) { return sets.some(function (s) { return s.prices[t.key] != null; }); });
    var table = '<table class="terms"><thead><tr><th>Payment term</th>' + sets.map(function (s) { return "<th>" + esc(s.label) + "</th>"; }).join("") + "</tr></thead><tbody>"
      + rows.map(function (t) {
        var banks = t.text.replace(/^[^:]*:\s*/, "").replace(/\.$/, "");
        return '<tr class="' + (t.key === "cash" ? "cash" : "") + '"><td><div class="term">' + esc(t.label.replace(/\s*\(.*\)$/, "")) + '</div><div class="banks">' + esc(t.key === "cash" || t.key === "m3" || t.key === "hc" || t.key === "m9" ? t.text.replace(/\.$/, "") : banks) + "</div></td>"
          + sets.map(function (s) {
            var v = s.prices[t.key];
            if (v == null) return '<td><span class="none">—</span></td>';
            var mo = MONTHS[t.key] ? v / MONTHS[t.key] : null;
            return '<td class="pick" data-term="' + t.key + '" data-set="' + s.key + '" title="Add to the quotation: ' + esc(t.label) + (sets.length > 1 ? ", " + esc(s.label.toLowerCase()) : "") + '"><div class="amt">' + peso(v) + "</div>" + (mo ? '<div class="mo">' + peso(mo) + "/mo" + "</div>" : "") + "</td>";
          }).join("") + "</tr>";
      }).join("") + "</tbody></table>";

    var side = "";
    var worth = promo.terms && promo.terms.bundleWorth;
    if (promo.freebies.length || worth || promo.bundle) {
      side += '<div class="card box"><h3><i class="bi bi-box2-heart" style="color:var(--blue)"></i> ' + (promo.freebies.length ? "Bundle freebies" : "Bundle") + "</h3>"
        // The bundle's name (BUNDLE CODE in the price matrix).
        + (promo.bundle ? '<div class="bundle-name"><span>Bundle</span><b>' + esc(promo.bundle) + "</b></div>" : "")
        + (promo.freebies.length ? "<ul>" + promo.freebies.map(function (f) { return '<li><i class="bi bi-check-circle-fill"></i><span>' + esc(f) + "</span></li>"; }).join("") + "</ul>" : "")
        + (worth ? '<div class="worth"' + (promo.freebies.length ? "" : ' style="margin-top:0;padding-top:0;border-top:0"') + "><span>Total worth</span><b>" + peso(worth) + "</b></div>" : "") + "</div>";
    }
    if (promo.start || promo.end) {
      var s = dateState(promo);
      side += '<div class="card box"><h3><i class="bi bi-calendar-event" style="color:var(--blue)"></i> Promo dates</h3><div class="dates"><span>' + esc(dayLabel(promo.start) || "—") + '</span><i class="bi bi-arrow-right arrow"></i><span>' + esc(dayLabel(promo.end) || "—") + "</span>"
        + (s ? '<span class="tag ' + s.cls + '">' + esc(s.text) + "</span>" : "") + "</div></div>";
    }
    if (promo.vendor.length) {
      side += '<div class="card box"><h3><i class="bi bi-patch-check" style="color:var(--green)"></i> Vendor freebies to end user</h3><ul>' + promo.vendor.map(function (v) {
        return '<li><i class="bi bi-award-fill" style="color:var(--green)"></i><span>' + esc(v.text) + (v.validity ? '<span class="valid">Claiming: ' + esc(v.validity) + "</span>" : "") + "</span></li>";
      }).join("") + "</ul></div>";
    }
    if (promo.incentive) {
      var amount = /^[\d,.]+$/.test(promo.incentive) ? peso(Number(promo.incentive.replace(/,/g, ""))) : esc(promo.incentive);
      side += '<div class="card box staff"><h3><i class="bi bi-lock-fill"></i> Vendor promo<span class="lock">STAFF ONLY</span></h3><div class="amount">' + amount + "</div>"
        + (promo.incentiveValidity ? '<span class="valid">Valid ' + esc(promo.incentiveValidity) + "</span>" : "") + "</div>";
    }
    if (!side) side = '<div class="card box"><div class="muted"><i class="bi bi-info-circle"></i> No freebies, dates or vendor promos for this one.</div></div>';
    side = stockBox(p) + side;

    h += '<div class="grid"><div class="card">' + table + '</div><div class="side">' + side + "</div></div>";
    el("detail").innerHTML = h;
    el("detail").scrollTop = 0;
  }

  // ---------- compare ----------
  function compared() {
    return state.compare.map(function (id) { return products.filter(function (p) { return p.id === id; })[0]; }).filter(Boolean);
  }
  function toggleCompare(p) {
    var i = state.compare.indexOf(p.id);
    if (i !== -1) state.compare.splice(i, 1);
    else if (state.compare.length >= COMPARE_MAX) { toast("Compare holds " + COMPARE_MAX + " products: remove one first"); return; }
    else state.compare.push(p.id);
    remember();
    if (state.view === "compare" && !compared().length) state.view = "detail";
    renderDetail();
  }
  // The bar under the filters: the products picked to compare, with Compare / Back.
  function renderTray() {
    var list = compared();
    el("tray").hidden = !list.length;
    if (!list.length) { el("tray").innerHTML = ""; return; }
    el("tray").innerHTML = '<i class="bi bi-layout-three-columns"></i> Compare'
      + list.map(function (p) { return '<span class="chip" title="' + esc(p.code) + '"><span>' + esc(p.model) + (p.partNumber ? " · " + esc(p.partNumber) : "") + '</span><button type="button" data-uncompare="' + esc(p.id) + '" aria-label="Remove ' + esc(p.model) + ' from compare">✕</button></span>'; }).join("")
      + '<span class="spacer"></span>'
      + (state.view === "compare"
        ? '<button type="button" class="btn light" data-tray="back"><i class="bi bi-arrow-left"></i> Back to the product</button>'
        : '<button type="button" class="btn" data-tray="open"' + (list.length < 2 ? ' disabled title="Pick one more product to compare"' : "") + '><i class="bi bi-layout-three-columns"></i> Compare ' + list.length + "</button>")
      + '<button type="button" class="btn light" data-tray="clear">Clear</button>';
  }
  function comparePromoOf(p) {
    var i = state.comparePromo[p.id] || 0;
    return p.promos[i] || p.promos[0];
  }
  function renderCompare() {
    var list = compared();
    var cols = list.map(function (p) {
      var promo = comparePromoOf(p), sets = setsFor(p, promo), setKey = defaultSet(sets);
      var set = sets.filter(function (s) { return s.key === setKey; })[0] || { prices: {} };
      var noBundle = sets.filter(function (s) { return s.key === "noBundle"; })[0];
      return { p: p, promo: promo, sets: sets, setKey: setKey, prices: set.prices, label: set.label, noBundle: noBundle && noBundle.key !== setKey ? noBundle : null };
    });
    // The lowest value in a row is marked (when two or more products have one).
    function lowest(values) {
      var nums = values.filter(function (v) { return v != null; });
      return nums.length > 1 ? Math.min.apply(null, nums) : null;
    }
    function row(label, cells, cls) { return "<tr" + (cls ? ' class="' + cls + '"' : "") + '><td class="lbl">' + label + "</td>" + cells.join("") + "</tr>"; }
    function priceRow(label, values, note) {
      var low = lowest(values);
      return row(esc(label), values.map(function (v, i) {
        if (v == null) return '<td><span style="color:#cbd5e1">—</span></td>';
        return '<td><span class="amt' + (low !== null && Math.abs(v - low) < 0.005 ? " win" : "") + '">' + peso(v) + "</span>" + (note ? note(v, i) : "") + "</td>";
      }));
    }
    var h = '<div class="card compare"><table class="cmp"><thead><tr><th class="lbl">' + list.length + " products</th>" + cols.map(function (c) {
      var p = c.p;
      return "<th><span class=\"tag kind\">" + esc(p.kindLabel) + "</span><h3>" + esc(p.model) + '</h3><div class="code">' + (p.partNumber ? "<b>" + esc(p.partNumber) + "</b> · " : "") + esc(p.code) + "</div>"
        + (p.promos.length > 1 ? '<div style="margin-top:6px"><select data-cmp-promo="' + esc(p.id) + '" aria-label="Promo">' + p.promos.map(function (x, i) { return '<option value="' + i + '"' + (x === c.promo ? " selected" : "") + ">" + esc(x.title) + (x.branches.length ? " · " + esc(x.branches.join(", ")) : "") + "</option>"; }).join("") + "</select></div>" : "")
        + '<div class="acts"><button type="button" class="btn quote" data-cmp-quote="' + esc(p.id) + '"><i class="bi bi-file-earmark-plus"></i> Add to Quotation</button>'
        + '<button type="button" class="btn light" data-cmp-open="' + esc(p.id) + '">Details</button>'
        + '<button type="button" class="btn light" data-uncompare="' + esc(p.id) + '" aria-label="Remove from compare">✕</button></div></th>';
    }).join("") + "</tr></thead><tbody>";
    var span = '<td colspan="' + list.length + '"></td>';
    h += row("Prices", [span], "sec");
    h += priceRow("Cash" + (cols.some(function (c) { return c.sets.length > 1; }) ? " (with bundle)" : ""), cols.map(function (c) { return c.prices.cash != null ? c.prices.cash : null; }));
    if (cols.some(function (c) { return c.noBundle; })) h += priceRow("Cash without bundle", cols.map(function (c) { return c.noBundle && c.noBundle.prices.cash != null ? c.noBundle.prices.cash : null; }));
    TERMS.filter(function (t) { return t.key !== "cash" && cols.some(function (c) { return c.prices[t.key] != null; }); }).forEach(function (t) {
      h += priceRow(t.label, cols.map(function (c) { return c.prices[t.key] != null ? c.prices[t.key] : null; }), function (v) {
        return MONTHS[t.key] ? '<div class="mo">' + peso(v / MONTHS[t.key]) + "/mo</div>" : "";
      });
    });
    h += priceRow("Lowest a month", cols.map(function (c) {
      var low = null;
      Object.keys(MONTHS).forEach(function (k) { if (c.prices[k] != null) { var m = c.prices[k] / MONTHS[k]; if (low === null || m < low) low = m; } });
      return low;
    }));
    h += row("Promo", [span], "sec");
    h += row("Promo", cols.map(function (c) { return "<td>" + esc(hasPromo(c.promo) ? c.promo.title : "No promo") + (c.promo.branches.length ? '<div class="mo">' + esc(c.promo.branches.join(", ")) + "</div>" : "") + "</td>"; }));
    h += row("Dates", cols.map(function (c) {
      var s = dateState(c.promo);
      return "<td>" + (c.promo.start || c.promo.end ? esc(dayLabel(c.promo.start) || "—") + " → " + esc(dayLabel(c.promo.end) || "—") : '<span style="color:#cbd5e1">—</span>') + (s ? ' <span class="tag ' + s.cls + '">' + esc(s.text) + "</span>" : "") + "</td>";
    }));
    h += row("Freebies", cols.map(function (c) { return "<td>" + (c.promo.freebies.length ? esc(c.promo.freebies.join(", ")) : '<span style="color:#cbd5e1">—</span>') + "</td>"; }));
    var worths = cols.map(function (c) { return c.promo.terms && c.promo.terms.bundleWorth > 0 ? c.promo.terms.bundleWorth : null; });
    if (worths.some(function (w) { return w != null; })) {
      var most = worths.filter(function (w) { return w != null; }).length > 1 ? Math.max.apply(null, worths.filter(function (w) { return w != null; })) : null;
      h += row("Freebie worth", worths.map(function (w) { return w == null ? '<td><span style="color:#cbd5e1">—</span></td>' : '<td><span class="amt' + (most !== null && w === most ? " win" : "") + '">' + peso(w) + "</span></td>"; }));
    }
    if (cols.some(function (c) { return c.promo.vendor.length; })) h += row("Vendor freebies", cols.map(function (c) { return "<td>" + (c.promo.vendor.length ? esc(c.promo.vendor.map(function (v) { return v.text; }).join("; ")) : '<span style="color:#cbd5e1">—</span>') + "</td>"; }));
    if (meta.hasStock && cols.some(function (c) { return c.p.kind === "laptop"; })) {
      var home = meta.homeBranch && ["HO", "ALL", "ALL BRANCHES"].indexOf(meta.homeBranch) === -1 ? meta.homeBranch : "";
      h += row("Stock" + (meta.stockAsOf ? ' <span style="text-transform:none;font-weight:600">as of ' + esc(dayLabel(meta.stockAsOf)) + "</span>" : ""), [span], "sec");
      if (home) h += row(esc(home), cols.map(function (c) { var n = units(c.p, home); return "<td>" + (c.p.kind !== "laptop" ? "—" : '<b style="color:' + (n ? "var(--green)" : "var(--red)") + '">' + (n || "None") + "</b>") + "</td>"; }));
      h += row("All branches", cols.map(function (c) { return "<td>" + (c.p.kind !== "laptop" ? "—" : totalUnits(c.p) + " unit" + (totalUnits(c.p) === 1 ? "" : "s")) + "</td>"; }));
    }
    var labels = [];
    cols.forEach(function (c) { c.p.specs.forEach(function (s) { if (labels.indexOf(s[0]) === -1) labels.push(s[0]); }); });
    if (labels.length) {
      h += row("Specs", [span], "sec");
      labels.forEach(function (label) {
        h += row(esc(label), cols.map(function (c) { var s = c.p.specs.filter(function (x) { return x[0] === label; })[0]; return "<td>" + (s ? esc(s[1]) : '<span style="color:#cbd5e1">—</span>') + "</td>"; }));
      });
    }
    // Staff only: hidden with the Vendor promo switch off (body.hide-staff .staff).
    if (cols.some(function (c) { return c.promo.incentive; })) {
      h += row('<i class="bi bi-lock-fill"></i> Vendor promo', cols.map(function (c) { return '<td class="staff" style="color:var(--violet);font-weight:800">' + esc(c.promo.incentive || "—") + "</td>"; }), "staff");
    }
    h += "</tbody></table></div>";
    el("detail").innerHTML = h;
    el("detail").scrollTop = 0;
  }

  // Prices to paste into a chat: never the incentives.
  function copyText() {
    var p = current(); if (!p) return "";
    var promo = p.promos[state.promo] || p.promos[0];
    var sets = setsFor(p, promo);
    var lines = [p.model + (p.partNumber ? " (" + p.partNumber + ")" : ""), p.code];
    if (hasPromo(promo)) lines.push("Promo: " + promo.title);
    lines.push("");
    TERMS.forEach(function (t) {
      var parts = sets.filter(function (s) { return s.prices[t.key] != null; }).map(function (s) { return (sets.length > 1 ? s.label + " " : "") + peso(s.prices[t.key]); });
      if (parts.length) lines.push(t.label + ": " + parts.join(" · "));
    });
    if (promo.bundle) lines.push("", "Bundle: " + promo.bundle + (!promo.freebies.length && promo.terms.bundleWorth ? " (worth " + peso(promo.terms.bundleWorth) + ")" : ""));
    if (promo.freebies.length) {
      if (!promo.bundle) lines.push("");
      lines.push("Freebies: " + promo.freebies.join(", ") + (promo.terms.bundleWorth ? " (worth " + peso(promo.terms.bundleWorth) + ")" : ""));
    }
    if (promo.vendor.length) lines.push("Vendor freebies: " + promo.vendor.map(function (v) { return v.text; }).join("; "));
    if (promo.end) lines.push("Promo until " + dayLabel(promo.end));
    lines.push("", "Prices are subject to change without prior notice.");
    return lines.join("\n");
  }

  function render() { renderKinds(); renderList(); renderDetail(); }
  var toastTimer;
  function toast(message) { el("toast").textContent = message; el("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el("toast").classList.remove("show"); }, 1600); }

  // ---------- events ----------
  el("kinds").addEventListener("click", function (e) {
    var b = e.target.closest("[data-kind]"); if (!b) return;
    state.kind = b.getAttribute("data-kind"); state.category = ""; state.selected = ""; remember(); render();
  });
  el("category").addEventListener("change", function () { state.category = el("category").value; renderList(); renderDetail(); });
  el("sort").addEventListener("change", function () { state.sort = el("sort").value; remember(); renderList(); renderDetail(); });
  el("promoOnly").addEventListener("change", function () { state.promoOnly = el("promoOnly").checked; remember(); renderList(); renderDetail(); });
  el("showStaff").addEventListener("change", function () { try { localStorage.setItem("saleskit.pricing.staff", el("showStaff").checked ? "1" : "0"); } catch (e) { /* not kept */ } applyStaff(); });
  var searchTimer;
  el("search").addEventListener("input", function () {
    el("searchBox").classList.toggle("has-text", Boolean(el("search").value));
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = el("search").value;
      // A search that finds nothing in this group but something in another switches to it.
      if (state.query && !visible().length) {
        var other = KINDS.map(function (k) { return k[0]; }).filter(function (k) {
          var keep = state.kind; state.kind = k; var n = visible().length; state.kind = keep; return n;
        })[0];
        if (other) { state.kind = other; state.category = ""; renderKinds(); }
      }
      renderList();
      if (document.activeElement === el("search")) openResults();
      renderDetail();
    }, 120);
  });
  el("search").addEventListener("focus", function () { renderList(); openResults(); });
  el("search").addEventListener("click", function () { if (!el("results").classList.contains("open")) openResults(); });
  el("search").addEventListener("keydown", function (e) {
    var open = el("results").classList.contains("open");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!open) openResults(); else moveActive(e.key === "ArrowDown" ? 1 : -1); }
    else if (e.key === "Enter") { e.preventDefault(); if (open) { pick(Math.max(0, active)); el("search").blur(); } }
    else if (e.key === "Escape") { if (open) { e.preventDefault(); e.stopPropagation(); closeResults(); } }
    else if (e.key === "Tab") closeResults();
  });
  // A click in the dropdown picks without losing the search box first.
  el("results").addEventListener("mousedown", function (e) {
    e.preventDefault();
    var b = e.target.closest("[data-i]");
    if (b) { pick(Number(b.getAttribute("data-i"))); el("search").blur(); }
  });
  el("search").addEventListener("blur", function () { setTimeout(closeResults, 120); });
  el("clearSearch").addEventListener("mousedown", function (e) { e.preventDefault(); });
  el("clearSearch").addEventListener("click", function () { el("search").value = ""; el("search").dispatchEvent(new Event("input")); el("search").focus(); });
  function byId(id) { return products.filter(function (p) { return p.id === id; })[0] || null; }
  // Add to Quotation with the promo on screen, with bundle (or the only price set), cash.
  function quoteCurrent() {
    var p = current();
    if (!p || state.view !== "detail") return;
    var promo = p.promos[state.promo] || p.promos[0];
    quote(p, promo, defaultSet(setsFor(p, promo)), "cash");
  }
  el("detail").addEventListener("click", function (e) {
    var chip = e.target.closest("[data-promo]");
    if (chip) { state.promo = Number(chip.getAttribute("data-promo")); renderDetail(); return; }
    if (e.target.closest("#prev")) { step(-1); return; }
    if (e.target.closest("#next")) { step(1); return; }
    if (e.target.closest("#copy")) { toParent({ channel: "saleskit-pricing-copy", text: copyText() }); return; }
    if (e.target.closest("#quote")) { quoteCurrent(); return; }
    if (e.target.closest("#compareToggle")) { var cp = current(); if (cp) toggleCompare(cp); return; }
    // A price in the terms table: quoted at that term and price set.
    var cell = e.target.closest("td.pick");
    if (cell) {
      var p = current();
      if (p) quote(p, p.promos[state.promo] || p.promos[0], cell.getAttribute("data-set"), cell.getAttribute("data-term"));
      return;
    }
    // Compare view
    var b = e.target.closest("[data-cmp-quote],[data-cmp-open],[data-uncompare]");
    if (!b) return;
    var target = byId(b.getAttribute("data-cmp-quote") || b.getAttribute("data-cmp-open") || b.getAttribute("data-uncompare"));
    if (!target) return;
    if (b.hasAttribute("data-uncompare")) { toggleCompare(target); return; }
    if (b.hasAttribute("data-cmp-quote")) {
      var promo = comparePromoOf(target);
      quote(target, promo, defaultSet(setsFor(target, promo)), "cash");
      return;
    }
    // Details: that product's own view (its group and the promo picked here).
    state.kind = target.kind; state.category = ""; state.query = ""; el("search").value = ""; el("searchBox").classList.remove("has-text");
    state.selected = target.id; state.promo = Math.max(0, target.promos.indexOf(comparePromoOf(target))); state.view = "detail";
    lastPicked[state.kind] = target.id; remember();
    renderKinds(); renderList(); renderDetail();
  });
  el("detail").addEventListener("change", function (e) {
    var select = e.target.closest("[data-cmp-promo]");
    if (!select) return;
    state.comparePromo[select.getAttribute("data-cmp-promo")] = Number(select.value);
    renderCompare();
  });
  el("tray").addEventListener("click", function (e) {
    var un = e.target.closest("[data-uncompare]");
    if (un) { var p = byId(un.getAttribute("data-uncompare")); if (p) toggleCompare(p); return; }
    var b = e.target.closest("[data-tray]");
    if (!b || b.disabled) return;
    var what = b.getAttribute("data-tray");
    if (what === "open") state.view = "compare";
    else if (what === "back") state.view = "detail";
    else if (what === "clear") { state.compare = []; state.view = "detail"; remember(); }
    renderDetail();
  });
  // Left / right arrows step through the products (not while typing or in a dropdown).
  document.addEventListener("keydown", function (e) {
    var ctrl = e.ctrlKey || e.metaKey;
    var typing = e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement;
    if (e.key === "?" && !ctrl && !typing) { e.preventDefault(); toParent({ channel: "saleskit-pricing-help" }); return; }
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !typing && !ctrl && !e.altKey) { e.preventDefault(); step(e.key === "ArrowRight" ? 1 : -1); return; }
    if (!ctrl || e.altKey) return;
    if (!e.shiftKey && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); toParent({ channel: "saleskit-pricing-hotkey", keys: { ctrl: true, shift: false, alt: false, code: e.code } }); }
    else if (e.shiftKey && e.code === "KeyL") { e.preventDefault(); el("search").focus(); el("search").select(); }
    else if (!e.shiftKey && e.code === "KeyQ") { e.preventDefault(); quoteCurrent(); }
    else if (!e.shiftKey && e.code === "KeyC" && !window.getSelection().toString() && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); toParent({ channel: "saleskit-pricing-copy", text: copyText() }); }
  });

  // ---------- data from the app (pricing-matrix-bridge.js) ----------
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent || !event.data) return;
    var m = event.data;
    if (m.channel === "saleskit-pricing-data") {
      products = Array.isArray(m.products) ? m.products : [];
      meta = { hasStock: Boolean(m.hasStock), stockAsOf: m.stockAsOf || "", homeBranch: m.homeBranch || "" };
      render();
    } else if (m.channel === "saleskit-pricing-status") {
      toast(m.message || "");
    }
  });
  toParent({ channel: "saleskit-pricing-ready" });
})();
</script>
</body>
</html>
